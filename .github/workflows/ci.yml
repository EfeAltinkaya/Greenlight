name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Route smoke (demo)
        run: |
          npm run start -- -p 3456 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3456/ >/dev/null && break
            sleep 1
          done
          node scripts/smoke-routes.mjs http://127.0.0.1:3456
