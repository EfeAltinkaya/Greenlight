name: ML retrain

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 15:00 UTC
    - cron: "0 15 * * 1"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML deps
        run: pip install -r ml/requirements.txt

      - name: Embed + train heads + vendor index
        run: |
          python ml/embed.py --task all
          python ml/train_heads.py --task items
          python ml/train_heads.py --task board
          python ml/train_heads.py --task replies
          python ml/build_vendor_index.py
          python ml/train_rank.py || true

      - name: Show reports
        run: |
          echo "## Items" && head -n 40 ml/reports/items.md
          echo "## Board" && head -n 40 ml/reports/board.md
          echo "## Replies" && head -n 40 ml/reports/replies.md

      # Opening a PR automatically is optional; document the step for maintainers.
      - name: Document PR step
        run: |
          cat <<'EOF'
          Retrain finished. To publish heads:
            1. Review ml/reports/{items,board,replies}.md (ship only if macro F1 beats baselines).
            2. Commit public/models/heads/*.json and public/models/vendors.emb.json when shipped.
            3. Open a PR titled "chore(ml): retrain Greenlight Models heads" against main.
            Optional: use `gh pr create` from a branch with the updated artifacts.
          EOF

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ml-reports
          path: |
            ml/reports/
            public/models/
